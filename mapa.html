                extend: {

                        dourado: '#C9A227',
                        carvao: '#050505',
                        marfim: '#F3EFE3',

                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],

                        serif: ['Cinzel', 'serif']

            }
        }

    <style>

<body class="font-inter antialiased min-h-screen relative selection:bg-dourado selection:text-carvao bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#1a1a24] via-[#050505] to-black">

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script>Fancybox.bind("[data-fancybox]", {});</script>
